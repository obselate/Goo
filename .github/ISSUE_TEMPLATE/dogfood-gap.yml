name: Owner dogfood gap
description: Repository-owner self-report for a capability blocked while building with Goo
labels:
  - proposal
body:
  - type: markdown
    attributes:
      value: |
        For repository-owner dogfood reports only. Other users should use the core proposal form.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: State the capability Goo cannot currently express and why it belongs at the framework boundary.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest code or exact steps that prove the current public API is insufficient.
    validations:
      required: true

  - type: textarea
    id: potential-solution
    attributes:
      label: Potential solution
      description: Suggest the smallest general Goo capability. This suggestion is not the architectural decision.
    validations:
      required: true
